# Netlify deployment configuration for the static portfolio.
[build]
  publish = "."

# The service worker must be revalidated on every visit so updates go live immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
