<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Inventory control workflow with Sage Inventory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c37"/><stop offset="1" stop-color="#105d78"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#63d0b2"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="18" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.09" fill="none">
    <path d="M0 300 180 300 260 360 900 360"/><path d="M620 0 700 80 900 80"/>
    <circle cx="180" cy="300" r="4" fill="#ffffff" fill-opacity="0.2" stroke="none"/>
    <circle cx="700" cy="80" r="4" fill="#ffffff" fill-opacity="0.2" stroke="none"/>
  </g>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Inventory control workflow</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9cece9">TRI CLOVER INDUSTRIES LTD · IT INTERNSHIP</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="34" y="140" width="174" height="132" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="121" y="184" font-size="34" font-weight="700" fill="#ffd89b">01</text>
      <text x="121" y="216" font-size="16" font-weight="700" fill="#ffffff">Stock movement</text>
      <text x="121" y="240" font-size="12" fill="#cfe3f4">Goods in &amp; out</text>
    </g>
    <path d="M214 206 H250" stroke="#63d0b2" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="258" y="140" width="174" height="132" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#63d0b2" stroke-opacity="0.6"/>
      <text x="345" y="184" font-size="34" font-weight="700" fill="#9cece9">02</text>
      <text x="345" y="216" font-size="16" font-weight="700" fill="#ffffff">Sage Inventory</text>
      <text x="345" y="240" font-size="12" fill="#cfe3f4">Records updated</text>
    </g>
    <path d="M438 206 H474" stroke="#63d0b2" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="482" y="140" width="174" height="132" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="569" y="184" font-size="34" font-weight="700" fill="#ffd89b">03</text>
      <text x="569" y="216" font-size="16" font-weight="700" fill="#ffffff">Stock-taking</text>
      <text x="569" y="240" font-size="12" fill="#cfe3f4">Physical count</text>
    </g>
    <path d="M662 206 H698" stroke="#63d0b2" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="706" y="140" width="160" height="132" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="786" y="184" font-size="34" font-weight="700" fill="#9cece9">04</text>
      <text x="786" y="216" font-size="16" font-weight="700" fill="#ffffff">Reliable records</text>
      <text x="786" y="240" font-size="12" fill="#cfe3f4">Better decisions</text>
    </g>
