<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Illustrative office network topology">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c37"/><stop offset="1" stop-color="#0f6f78"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" rx="18" fill="url(#bg2)"/>
  <g stroke="#ffffff" stroke-opacity="0.08" fill="none">
    <path d="M0 90 200 90 280 20"/><path d="M700 360 780 280 900 280"/>
  </g>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Office network setup</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9cece9">INSTALLATION · CONFIGURATION · MAINTENANCE</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g stroke="#63d0b2" stroke-width="2.5" stroke-opacity="0.85" fill="none">
